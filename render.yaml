# Render Blueprint (New > Blueprint, pointed at this repo): one free web service running bim-server,
# which serves the web app at / and the API at /api, plus a free Postgres for accounts and projects.
# Free tier: the service sleeps after idle time (first request wakes it), and free Postgres
# databases expire, so upgrade both plans before relying on stored projects.
services:
  - type: web
    name: buildsim
    runtime: docker
    plan: free
    dockerfilePath: ./crates/bim-server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buildsim-db
          property: connectionString
      # Render's proxy appends the client IP to X-Forwarded-For; the auth rate limits key on it
      - key: TRUST_PROXY
        value: "true"
      # Password reset email. Set both in the dashboard (any provider's SMTP endpoint), e.g.
      #   SMTP_URL  smtps://USER:PASSWORD@smtp.resend.com:465
      #   MAIL_FROM buildsim <no-reply@yourdomain.com>
      # Links point at RENDER_EXTERNAL_URL unless PUBLIC_URL is set. Without these, reset is off.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      # Error reporting: the DSN of a Sentry (or self-hosted GlitchTip) project. Unset = off.
      - key: SENTRY_DSN
        sync: false

databases:
  - name: buildsim-db
    plan: free
    databaseName: buildsim
    user: buildsim
    # matches the pg_dump client in .github/workflows/backup.yml
    postgresMajorVersion: "17"
