server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # wasm must be served with the right type or instantiateStreaming fails
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;

    # hashed build output can cache hard; app files should not
    location /pkg/ { add_header Cache-Control "public, max-age=3600"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    location / { try_files $uri $uri/ =404; }
}
