[package]
name = "bim-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# Keeps the shared Cargo.lock buildable by the rust:1.83 image in web/Dockerfile.
rust-version = "1.83"

[dependencies]
bim-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "net", "signal"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "json"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
argon2 = { version = "=0.5.3", features = ["std"] }
sha2 = "=0.10.9"
rand = "=0.8.8"
hex = "=0.4.3"
tower-http = { version = "=0.6.11", features = ["cors", "fs", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"
