name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: node --test web/*.test.mjs
      - run: cargo install cargo-deny --locked && cargo deny check licenses
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bim
          POSTGRES_PASSWORD: bim
          POSTGRES_DB: bim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bim -d bim_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://bim:bim@localhost:5432/bim_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p bim-server --locked
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p bim-wasm --target wasm32-unknown-unknown --release
      - run: cargo install wasm-bindgen-cli --version 0.2.92 --locked
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/bim_wasm.wasm --target web --out-dir web/pkg
      - run: mkdir -p web/rules && cp rules/*.json web/rules/
      - uses: actions/upload-artifact@v4
        with: { name: web, path: web }
